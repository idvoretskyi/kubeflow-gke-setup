name: Stale PR Cleanup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale pull requests
        uses: actions/stale@v10
        with:
          days-before-pr-stale: 45
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has had no activity for 45 days, so it was marked as stale.
            It will be closed automatically in 7 days unless new activity is added.
          close-pr-message: >
            Closing this pull request due to inactivity.
            Comment or push new commits to reopen and continue.
          exempt-pr-labels: keep-open,security,work-in-progress
          days-before-issue-stale: -1
          days-before-issue-close: -1
