name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  python-check:
    name: Python Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd examples/sample-ml-app
        pip install -r requirements.txt

    - name: Python Syntax Check
      run: |
        cd examples/sample-ml-app
        python -m py_compile pipeline.py
        python -m py_compile data_generator.py
        python -m py_compile run_pipeline.py
        echo "Python syntax check passed ✓"

  terraform-check:
    name: Terraform Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.12.2"

    - name: Terraform Format Check
      run: |
        cd terraform
        terraform fmt -check -recursive
        echo "Terraform format check passed ✓"

    - name: Terraform Init and Validate
      run: |
        cd terraform
        terraform init -backend=false
        terraform validate
        echo "Terraform validation passed ✓"

  basic-tests:
    name: Basic Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Test basic functionality
      run: |
        echo "Basic functionality test passed ✓"

    - name: Check required files
      run: |
        [ -f README.md ] || (echo "README.md is missing!" && exit 1)
        [ -f terraform/terraform.tfvars.example ] || (echo "terraform.tfvars.example is missing!" && exit 1)
        [ -f examples/sample-ml-app/README.md ] || (echo "Sample app README is missing!" && exit 1)
        [ -f terraform/services.tf ] || (echo "services.tf is missing!" && exit 1)
        echo "Required files check passed ✓"